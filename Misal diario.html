<title>Misal diario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Lecturas de la Misa de cada día según el calendario litúrgico de España">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Composición: una página de misal de bolsillo, columna única centrada, cinta marcapáginas del color litúrgico del día */
:root {
  --paper: #f5eedd;
  --paper-deep: #ece2c9;
  --paper-edge: #e3d6b8;
  --ink: #2b2118;
  --ink-soft: #6e5f4b;
  --rubric: #a52a20;
  --gilt: #a8843c;
  --rule: rgba(43, 33, 24, 0.16);
  --chip: #efe6d0;
  --chip-on: #2b2118;
  --chip-on-ink: #f5eedd;
  --lit-verde: #4d7a46;
  --lit-morado: #6a3d78;
  --lit-blanco: #e7d9a8;
  --lit-blanco-edge: #b99a52;
  --lit-rojo: #b0302a;
  --lit-rosa: #d58ea3;
  --lit-negro: #3a3532;
  --font-display: "IM Fell English", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-sc: "IM Fell English SC", "EB Garamond", Garamond, serif;
  --font-body: "EB Garamond", Garamond, "Iowan Old Style", "Times New Roman", serif;
  --step--1: 0.875rem;
  --step-0: 1.125rem;
  --step-1: 1.375rem;
  --step-2: 1.75rem;
  --step-3: 2.25rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c1712; --paper-deep: #241e17; --paper-edge: #2e261d;
    --ink: #ece2cd; --ink-soft: #b4a68e; --rubric: #e27a6c; --gilt: #c9a45c;
    --rule: rgba(236, 226, 205, 0.16); --chip: #2a231b; --chip-on: #ece2cd; --chip-on-ink: #1c1712;
    --lit-verde: #6e9d66; --lit-morado: #9a72a8; --lit-blanco: #e7d9a8; --lit-blanco-edge: #c9a45c;
    --lit-rojo: #d4554b; --lit-rosa: #e3a2b5; --lit-negro: #8a827c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c1712; --paper-deep: #241e17; --paper-edge: #2e261d;
  --ink: #ece2cd; --ink-soft: #b4a68e; --rubric: #e27a6c; --gilt: #c9a45c;
  --rule: rgba(236, 226, 205, 0.16); --chip: #2a231b; --chip-on: #ece2cd; --chip-on-ink: #1c1712;
  --lit-verde: #6e9d66; --lit-morado: #9a72a8; --lit-blanco: #e7d9a8; --lit-blanco-edge: #c9a45c;
  --lit-rojo: #d4554b; --lit-rosa: #e3a2b5; --lit-negro: #8a827c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  background-image:
    radial-gradient(120% 70% at 50% 0%, transparent 55%, var(--paper-deep) 100%),
    radial-gradient(90% 60% at 50% 100%, transparent 50%, var(--paper-edge) 130%);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
  min-height: 100vh;
}
.page {
  position: relative;
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 1.75rem 3rem;
}

/* Cinta marcapáginas */
.ribbon {
  position: absolute;
  top: 0;
  right: max(22px, calc(env(safe-area-inset-right, 0px) + 10px));
  width: 16px;
  height: 92px;
  background: var(--ribbon, var(--lit-verde));
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%);
  transition: background-color 0.5s ease, height 0.5s ease;
  box-shadow: inset 2px 0 0 rgba(255, 255, 255, 0.18), inset -2px 0 0 rgba(0, 0, 0, 0.12);
}
.ribbon.white { background: var(--lit-blanco); box-shadow: inset 0 0 0 1px var(--lit-blanco-edge); }

/* Cabecera */
.masthead { text-align: center; padding-right: 1.5rem; padding-left: 1.5rem; }
.masthead .kicker {
  font-family: var(--font-sc);
  color: var(--rubric);
  font-size: var(--step-0);
  letter-spacing: 0.14em;
  margin: 0;
}
.fleuron { display: flex; align-items: center; gap: 0.75rem; color: var(--gilt); margin: 0.5rem auto 0; max-width: 16rem; }
.fleuron::before, .fleuron::after { content: ""; flex: 1; height: 0; border-top: 1px solid var(--gilt); border-bottom: 1px solid var(--gilt); padding-top: 2px; opacity: 0.75; }
.fleuron span { font-size: 0.9rem; line-height: 1; }

/* Selector de días */
.days {
  margin: 1.5rem 0 0;
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  padding: 0.25rem 0.1rem 0.6rem;
  scrollbar-width: thin;
}
.day {
  flex: 0 0 auto;
  scroll-snap-align: start;
  min-width: 3.6rem;
  display: grid;
  justify-items: center;
  gap: 0.1rem;
  padding: 0.45rem 0.55rem 0.5rem;
  border: 1px solid var(--rule);
  border-radius: 0.6rem;
  background: var(--chip);
  color: var(--ink);
  font-family: var(--font-body);
  cursor: pointer;
  font-variant-numeric: lining-nums tabular-nums;
}
.day .wd { font-size: 0.8rem; font-variant-caps: all-small-caps; letter-spacing: 0.08em; color: var(--ink-soft); }
.day .num { font-size: 1.35rem; line-height: 1.1; font-weight: 500; }
.day .bar { width: 1.4rem; height: 4px; border-radius: 2px; background: var(--c, var(--lit-verde)); }
.day .bar.white { background: var(--lit-blanco); box-shadow: inset 0 0 0 1px var(--lit-blanco-edge); }
.day[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.day[aria-pressed="true"] .wd { color: var(--chip-on-ink); opacity: 0.8; }
.day:focus-visible, .other:focus-within, .mass button:focus-visible, a:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.other {
  position: relative;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  min-width: 4.4rem;
  padding: 0.45rem 0.6rem;
  border: 1px dashed var(--rule);
  border-radius: 0.6rem;
  color: var(--ink-soft);
  font-size: 0.85rem;
  line-height: 1.15;
  text-align: center;
  cursor: pointer;
}
.other input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

/* Día litúrgico */
.today { margin-top: 1.75rem; }
.date { font-style: italic; color: var(--ink-soft); margin: 0; }
.title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--step-3);
  line-height: 1.12;
  margin: 0.35rem 0 0;
  text-wrap: balance;
}
.title .ini { color: var(--rubric); font-size: 1.32em; line-height: 0.8; }
.sub { font-family: var(--font-display); font-style: italic; font-size: var(--step-1); color: var(--ink-soft); margin: 0.3rem 0 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.9rem; margin: 0.9rem 0 0; }
.rank { font-family: var(--font-sc); color: var(--rubric); letter-spacing: 0.1em; font-size: 1.05rem; }
.color { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--ink-soft); font-size: 1rem; }
.color i { width: 0.8rem; height: 0.8rem; border-radius: 50%; background: var(--c); display: inline-block; }
.color i.white { background: var(--lit-blanco); box-shadow: inset 0 0 0 1px var(--lit-blanco-edge); }
.cycle { color: var(--ink-soft); font-size: 1rem; font-variant-numeric: lining-nums; }
.extra { margin: 0.6rem 0 0; color: var(--ink-soft); font-size: 1rem; }
.extra b { font-weight: 400; font-variant-caps: all-small-caps; letter-spacing: 0.06em; color: var(--rubric); }
.temporal { font-style: italic; color: var(--ink-soft); margin: 0.35rem 0 0; }

.mass { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 1.4rem 0 0; }
.mass button {
  font: inherit;
  font-size: 0.95rem;
  padding: 0.3rem 0.75rem;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.mass button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.note { margin: 1.2rem 0 0; font-style: italic; color: var(--ink-soft); font-size: 1rem; }

/* Lecturas */
.readings { list-style: none; margin: 1.25rem 0 0; padding: 0; }
.reading { padding: 1.2rem 0 1.25rem; border-top: 1px solid var(--rule); }
.reading:first-child { border-top: 0; }
.label { font-family: var(--font-sc); color: var(--rubric); letter-spacing: 0.12em; font-size: 1rem; margin: 0; }
.rtitle { font-style: italic; margin: 0.2rem 0 0; color: var(--ink); }
.rtitle .cross { color: var(--rubric); font-style: normal; margin-right: 0.3rem; }
.cite {
  display: block;
  font-family: var(--font-body);
  font-size: var(--step-2);
  line-height: 1.2;
  margin: 0.35rem 0 0;
  font-variant-numeric: lining-nums;
  font-weight: 500;
  overflow-wrap: anywhere;
}
.read {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  margin-top: 0.55rem;
  color: var(--rubric);
  text-decoration: none;
  font-size: 1rem;
  border-bottom: 1px solid currentColor;
  padding-bottom: 1px;
}
.read svg { width: 0.85em; height: 0.85em; }
.alts { margin: 0.7rem 0 0; font-size: 1rem; color: var(--ink-soft); }
.alts a { color: inherit; }
.alts em { font-variant-caps: all-small-caps; font-style: normal; letter-spacing: 0.06em; color: var(--rubric); }

.closing { margin-top: 2rem; padding-top: 1.25rem; border-top: 3px double var(--gilt); }
.closing p { margin: 0 0 0.75rem; font-size: 1rem; color: var(--ink-soft); }
.closing a { color: var(--rubric); }
.amen { text-align: center; font-family: var(--font-display); font-style: italic; color: var(--gilt); margin-top: 1.5rem !important; }

@media (min-width: 600px) {
  .title { font-size: 2.6rem; }
  .page { padding-block: 2.5rem 4rem; }
}
@media (prefers-reduced-motion: reduce) { .ribbon { transition: none; } }
</style>

<div class="page">
  <div class="ribbon" id="ribbon" aria-hidden="true"></div>
  <header class="masthead">
    <p class="kicker">Lecturas de la Misa</p>
    <div class="fleuron" aria-hidden="true"><span>✠</span></div>
  </header>

  <nav class="days" id="days" aria-label="Elegir día"></nav>

  <main class="today" id="today" aria-live="polite"></main>

  <footer class="closing" id="closing"></footer>
</div>

<script>/* Motor del calendario litúrgico (Rito romano, calendario de España).
 * Calcula para cualquier fecha: tiempo, semana, ciclos A/B/C y I/II,
 * celebración principal según la Tabla de precedencias y la clave de lecturas.
 * Funciona en navegador (window.Liturgia) y en Node (module.exports). */
(function (root) {
  'use strict';

  var DAY = 86400000;
  function dn(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / DAY); }
  function ymd(n) { var t = new Date(n * DAY); return [t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()]; }
  function dow(n) { return ((n % 7) + 7 + 4) % 7; } // 0 = domingo
  function sundayOnOrBefore(n) { return n - dow(n); }
  function sundayAfter(n) { return n + (7 - dow(n)); }

  function easter(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
      h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return dn(y, month, day);
  }
  // Primer domingo de Adviento del año civil y (empieza el año litúrgico y+1)
  function advent1(y) { var x = dn(y, 12, 25); var s = x - (dow(x) === 0 ? 7 : dow(x)); return s - 21; }

  var ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII',
    'XVIII', 'XIX', 'XX', 'XXI', 'XXII', 'XXIII', 'XXIV', 'XXV', 'XXVI', 'XXVII', 'XXVIII', 'XXIX', 'XXX', 'XXXI', 'XXXII', 'XXXIII', 'XXXIV'];
  var DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  var MESES = ['', 'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  var RANK_NAME = { 1: 'Solemnidad', 2: 'Solemnidad', 3: 'Solemnidad', 4: 'Solemnidad', 5: 'Fiesta', 6: 'Domingo', 7: 'Fiesta', 8: 'Fiesta', 9: 'Feria', 10: 'Memoria obligatoria', 11: 'Memoria obligatoria', 12: 'Memoria libre', 13: 'Feria' };

  var CFG_ES = { epiphanyOnSunday: false, ascensionOnSunday: true, corpusOnSunday: true, spain: true };
  var CFG_US = { epiphanyOnSunday: true, ascensionOnSunday: true, corpusOnSunday: true, spain: false };

  function create(sanctoral, cfg) {
    cfg = cfg || CFG_ES;
    var yearCache = {};

    function epiphanyDate(y) {
      if (!cfg.epiphanyOnSunday) return dn(y, 1, 6);
      var j1 = dn(y, 1, 1); // domingo entre el 2 y el 8 de enero
      return sundayAfter(j1);
    }
    function baptismDate(y) {
      var ep = epiphanyDate(y);
      if (!cfg.epiphanyOnSunday) return sundayAfter(ep);
      var d = ymd(ep)[2];
      return d >= 7 ? ep + 1 : ep + 7;
    }
    function holyFamily(y) { // Navidad del año civil y
      for (var n = dn(y, 12, 26); n <= dn(y, 12, 31); n++) if (dow(n) === 0) return n;
      return dn(y, 12, 30);
    }

    // Datos del año litúrgico Y (que acaba en noviembre de Y)
    function yearData(Y) {
      if (yearCache[Y]) return yearCache[Y];
      var e = easter(Y), pent = e + 49;
      var o = {
        Y: Y, adv1: advent1(Y - 1), xmas: dn(Y - 1, 12, 25), nextAdv1: advent1(Y),
        hf: holyFamily(Y - 1), epiph: epiphanyDate(Y), bapt: baptismDate(Y),
        ash: e - 46, lent1: e - 42, palm: e - 7, easter: e,
        ascension: cfg.ascensionOnSunday ? e + 42 : e + 39, pent: pent,
        trinity: pent + 7, corpus: cfg.corpusOnSunday ? pent + 14 : pent + 11,
        heart: pent + 19, imHeart: pent + 20, christKing: advent1(Y) - 7
      };
      o.sunCycle = 'CAB'[Y % 3];
      o.wkCycle = Y % 2 === 1 ? 'I' : 'II';
      o.sanct = buildSanctoral(o);
      yearCache[Y] = o;
      return o;
    }

    // ---- Tiempo propio (temporal) ----
    function temporal(n, L) {
      var t = temporal0(n, L), k = t.key;
      if (k === 'JUEVES' || k === 'VIERNES' || k === 'VIGILIA') t.rankName = 'Triduo pascual';
      else if (k === 'NAV' || k === 'EPIF' || k === 'ASC' || k === 'PENT' || k === 'JAN1' || k === 'PAS1-0') t.rankName = 'Solemnidad';
      else if (k === 'SAGFAM' || k === 'BAUT') t.rankName = 'Fiesta';
      else if (/^PAS1-/.test(k)) t.rankName = 'Octava de Pascua';
      else if (k === 'CENIZA' || /^OCT/.test(k) || /^DEC/.test(k)) t.rankName = '';
      else if (t.dow === 0) t.rankName = 'Domingo';
      else t.rankName = 'Feria';
      return t;
    }
    function temporal0(n, L) {
      var w = dow(n), t = { dow: w };
      var md = ymd(n), m = md[1], d = md[2];
      if (n < L.xmas) { // Adviento
        var wk = Math.floor((n - L.adv1) / 7) + 1;
        t.season = 'adviento'; t.week = wk; t.color = 'morado';
        if (w === 0) {
          t.key = 'ADV' + wk + '-0'; t.rank = 2; t.name = 'Domingo ' + ROMAN[wk] + ' de Adviento';
          if (wk === 3) t.color = 'rosa';
        } else if (m === 12 && d >= 17) {
          t.key = 'DEC' + d; t.rank = 9; t.name = 'Feria mayor de Adviento';
          t.sub = d + ' de diciembre';
        } else {
          t.key = 'ADV' + wk + '-' + w; t.rank = 13; t.name = DIAS[w] + ' de la ' + ROMAN[wk] + ' semana de Adviento';
        }
        return t;
      }
      if (n <= L.bapt) { // Navidad
        t.season = 'navidad'; t.color = 'blanco';
        if (n === L.xmas) { t.key = 'NAV'; t.rank = 2; t.name = 'La Natividad del Señor'; return t; }
        if (n === L.hf) { t.key = 'SAGFAM'; t.rank = 5; t.name = 'La Sagrada Familia de Jesús, María y José'; return t; }
        if (m === 12) { t.key = 'OCT' + d; t.rank = 9; t.name = 'Día ' + d + ' de diciembre'; t.sub = 'Dentro de la Octava de Navidad'; return t; }
        if (m === 1 && d === 1) { t.key = 'JAN1'; t.rank = 3; t.name = 'Santa María, Madre de Dios'; t.sub = 'Octava de Navidad'; return t; }
        if (n === L.epiph) { t.key = 'EPIF'; t.rank = 2; t.name = 'La Epifanía del Señor'; return t; }
        if (n === L.bapt) { t.key = 'BAUT'; t.rank = 5; t.name = 'El Bautismo del Señor'; return t; }
        if (n < L.epiph) {
          if (w === 0) { t.key = 'NAV2DOM'; t.rank = 6; t.name = 'Domingo II después de Navidad'; return t; }
          t.key = 'JAN' + d; t.rank = 13; t.name = 'Feria del tiempo de Navidad'; t.sub = d + ' de enero'; return t;
        }
        // entre Epifanía y Bautismo
        if (!cfg.epiphanyOnSunday) { t.key = 'EPI' + (d - 6); t.sub = d + ' de enero'; }
        else { t.key = 'EPI' + w; t.sub = DIAS[w] + ' después de Epifanía'; }
        t.rank = 13; t.name = 'Feria del tiempo de Navidad';
        return t;
      }
      if (n < L.ash) { // Tiempo Ordinario I
        var base = sundayOnOrBefore(L.bapt);
        var wk1 = Math.floor((n - base) / 7) + 1;
        return ordinary(t, wk1, w);
      }
      if (n < L.easter) { // Cuaresma y Semana Santa
        t.season = 'cuaresma'; t.color = 'morado';
        if (n === L.ash) { t.key = 'CENIZA'; t.rank = 2; t.name = 'Miércoles de Ceniza'; return t; }
        if (n < L.lent1) { t.key = 'CEN-' + w; t.rank = 9; t.name = DIAS[w] + ' después de Ceniza'; return t; }
        var lw = Math.floor((n - L.lent1) / 7) + 1;
        t.week = lw;
        if (lw <= 5) {
          if (w === 0) { t.key = 'CUA' + lw + '-0'; t.rank = 2; t.name = 'Domingo ' + ROMAN[lw] + ' de Cuaresma'; if (lw === 4) t.color = 'rosa'; }
          else { t.key = 'CUA' + lw + '-' + w; t.rank = 9; t.name = DIAS[w] + ' de la ' + ROMAN[lw] + ' semana de Cuaresma'; }
          return t;
        }
        t.season = 'semanasanta';
        if (w === 0) { t.key = 'RAMOS'; t.rank = 2; t.color = 'rojo'; t.name = 'Domingo de Ramos en la Pasión del Señor'; return t; }
        if (w <= 3) { t.key = 'SEM-' + w; t.rank = 2; t.name = DIAS[w] + ' Santo'; return t; }
        if (w === 4) { t.key = 'JUEVES'; t.rank = 1; t.color = 'blanco'; t.name = 'Jueves Santo'; t.sub = 'Misa vespertina de la Cena del Señor'; t.season = 'triduo'; return t; }
        if (w === 5) { t.key = 'VIERNES'; t.rank = 1; t.color = 'rojo'; t.name = 'Viernes Santo de la Pasión del Señor'; t.season = 'triduo'; return t; }
        t.key = 'VIGILIA'; t.rank = 1; t.color = 'blanco'; t.name = 'Sábado Santo'; t.sub = 'Vigilia pascual en la noche santa'; t.season = 'triduo'; return t;
      }
      if (n <= L.pent) { // Pascua
        t.season = 'pascua'; t.color = 'blanco';
        var pw = Math.floor((n - L.easter) / 7) + 1; t.week = pw;
        if (n === L.easter) { t.key = 'PAS1-0'; t.rank = 1; t.name = 'Domingo de Pascua de la Resurrección del Señor'; return t; }
        if (n === L.pent) { t.key = 'PENT'; t.rank = 2; t.color = 'rojo'; t.name = 'Domingo de Pentecostés'; return t; }
        if (n === L.ascension) { t.key = 'ASC'; t.rank = 2; t.name = 'La Ascensión del Señor'; return t; }

  var Lit = window.Liturgia, Lec = window.Lecturas;
  var SANT = window.SANTORAL.map(function (a) { return { id: a[0], m: a[1], d: a[2], rank: a[3], color: a[4], name: a[5] }; });
  var Cal = Lit.create(SANT, Lit.CFG_ES);
  var MESES = Lit.MESES, DIAS = Lit.DIAS;
  var DIAS_C = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  var COLOR_VAR = { verde: '--lit-verde', morado: '--lit-morado', blanco: '--lit-blanco', rojo: '--lit-rojo', rosa: '--lit-rosa', negro: '--lit-negro' };
  var CYCLE_TXT = { I: 'año impar (I)', II: 'año par (II)' };

  var now = new Date();
  var T0 = Lit.dn(now.getFullYear(), now.getMonth() + 1, now.getDate());
  var END = T0 + 7; while (Lit.dow(END) !== 0) END++;
  var state = { n: T0, mass: null };

  function ymdStr(n) { var a = Lit.ymd(n); return a[0] + '-' + String(a[1]).padStart(2, '0') + '-' + String(a[2]).padStart(2, '0'); }
  function dayOf(n) { var a = Lit.ymd(n); return Cal.day(a[0], a[1], a[2]); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function colorize(node, color) {
    if (color === 'blanco') node.classList.add('white');
    else node.style.setProperty('--c', 'var(' + (COLOR_VAR[color] || '--lit-verde') + ')');
  }

  function readHash() {
    var m = /^#(\d{4})-(\d{2})-(\d{2})$/.exec(location.hash || '');
    if (m) state.n = Lit.dn(+m[1], +m[2], +m[3]);
  }

  // ---- Selector de días ----
  function renderDays() {
    var nav = document.getElementById('days');
    nav.textContent = '';
    for (var n = T0; n <= END; n++) {
      var d = dayOf(n), a = Lit.ymd(n);
      var b = el('button', 'day');
      b.type = 'button';
      b.id = 'day-' + ymdStr(n);
      b.dataset.n = n;
      b.setAttribute('aria-pressed', n === state.n ? 'true' : 'false');
      var label = n === T0 ? 'hoy' : (n === T0 + 1 ? 'mañana' : DIAS_C[d.dow]);
      b.setAttribute('aria-label', DIAS[d.dow] + ' ' + a[2] + ' de ' + MESES[a[1]] + ': ' + d.principal.name);
      b.appendChild(el('span', 'wd', label));
      b.appendChild(el('span', 'num', String(a[2])));
      var bar = el('span', 'bar'); colorize(bar, d.principal.color); b.appendChild(bar);
      b.addEventListener('click', function () { go(+this.dataset.n); });
      nav.appendChild(b);
    }
    var other = el('label', 'other');
    other.appendChild(el('span', '', 'Otra fecha'));
    var inp = document.createElement('input');
    inp.type = 'date'; inp.id = 'otra-fecha'; inp.setAttribute('aria-label', 'Elegir otra fecha');
    inp.value = ymdStr(state.n);
    inp.addEventListener('change', function () {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(inp.value);
      if (m) go(Lit.dn(+m[1], +m[2], +m[3]));
    });
    other.appendChild(inp);
    nav.appendChild(other);
    var on = nav.querySelector('[aria-pressed="true"]');
    if (on && on.scrollIntoView && state.n !== T0) { try { on.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
  }

  function go(n) {
    state.n = n; state.mass = null;
    try { history.replaceState(null, '', '#' + ymdStr(n)); } catch (e) {}
    renderDays(); render();
  }

  // ---- Día y lecturas ----
  function render() {
    var d = dayOf(state.n), p = d.principal, a = Lit.ymd(state.n);
    var main = document.getElementById('today');
    main.textContent = '';

    var ribbon = document.getElementById('ribbon');
    ribbon.classList.toggle('white', p.color === 'blanco');
    ribbon.style.setProperty('--ribbon', 'var(' + (COLOR_VAR[p.color] || '--lit-verde') + ')');

    main.appendChild(el('p', 'date', DIAS[d.dow] + ', ' + a[2] + ' de ' + MESES[a[1]] + ' de ' + a[0]));
    var h = el('h1', 'title');
    var name = p.name;
    var ini = el('span', 'ini', name.charAt(0));
    h.appendChild(ini); h.appendChild(document.createTextNode(name.slice(1)));
    main.appendChild(h);
    if (p.sub) main.appendChild(el('p', 'sub', p.sub));

    var meta = el('div', 'meta');
    if (d.rankName) meta.appendChild(el('span', 'rank', d.rankName));
    var col = el('span', 'color'); var dot = el('i'); colorize(dot, p.color); col.appendChild(dot);
    col.appendChild(document.createTextNode('Color ' + p.color)); meta.appendChild(col);
    meta.appendChild(el('span', 'cycle', 'Ciclo ' + d.sunCycle + ' · ' + CYCLE_TXT[d.wkCycle]));
    main.appendChild(meta);
    if (p.kind !== 'temporal') main.appendChild(el('p', 'temporal', d.temporal.name + (d.temporal.sub ? ' · ' + d.temporal.sub : '')));

    function extra(label, list) {
      if (!list || !list.length) return;
      var e = el('p', 'extra'); e.appendChild(el('b', '', label + ' ')); e.appendChild(document.createTextNode(list.join('; ')));
      main.appendChild(e);
    }
    extra('También memoria obligatoria:', d.alsoObligatory);
    extra(d.optional.length > 1 ? 'Memorias libres:' : 'Memoria libre:', d.optional);
    extra('Se puede hacer conmemoración de', d.commemorations);

    var res = Lec.readingsFor(d, window.LECT_T, window.LECT_S);
    var masses = res.masses;
    if (!state.mass || !masses.some(function (m) { return m.id === state.mass; })) {
      var pref = ['dia', 'cena', 'main'];
      state.mass = (masses.find(function (m) { return pref.indexOf(m.id) >= 0; }) || masses[0] || {}).id;
    }
    if (masses.length > 1) {
      var tabs = el('div', 'mass'); tabs.setAttribute('role', 'group'); tabs.setAttribute('aria-label', 'Misa');
      masses.forEach(function (m) {
        var b = el('button', '', m.label);
        b.type = 'button'; b.id = 'misa-' + m.id;
        b.setAttribute('aria-pressed', m.id === state.mass ? 'true' : 'false');
        b.addEventListener('click', function () { state.mass = m.id; render(); });
        tabs.appendChild(b);
      });
      main.appendChild(tabs);
    }
    if (res.note) main.appendChild(el('p', 'note', res.note));

    var current = masses.find(function (m) { return m.id === state.mass; });
    var ol = el('ol', 'readings');
    (current ? current.items : []).forEach(function (it) {
      var li = el('li', 'reading');
      li.appendChild(el('p', 'label', it.label));
      if (it.title) {
        var t = el('p', 'rtitle');
        if (it.gospel) t.appendChild(el('span', 'cross', '✠'));
        t.appendChild(document.createTextNode(it.title));
        li.appendChild(t);
      }
      li.appendChild(el('span', 'cite', it.cite));
      li.appendChild(readLink(it.link, 'Leer en la Biblia de la CEE'));
      if (it.alts.length) {
        var al = el('p', 'alts');
        al.appendChild(el('em', '', 'o bien '));
        it.alts.forEach(function (x, i) {
          if (i) al.appendChild(document.createTextNode(' · '));
          var aa = el('a', '', x.cite); aa.href = x.link; aa.target = '_blank'; aa.rel = 'noopener';
          al.appendChild(aa);
        });
        li.appendChild(al);
      }
      ol.appendChild(li);
    });
    main.appendChild(ol);

    renderClosing(a);
  }

  function readLink(href, text) {
    var l = el('a', 'read'); l.href = href; l.target = '_blank'; l.rel = 'noopener';
    l.appendChild(document.createTextNode(text));
    l.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3h7v7M13 3 4 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    return l;
  }

  function renderClosing(a) {
    var f = document.getElementById('closing');
    f.textContent = '';
    var dd = String(a[2]).padStart(2, '0') + '-' + String(a[1]).padStart(2, '0') + '-' + a[0];
    var p1 = el('p');
    p1.appendChild(document.createTextNode('Para rezar con el texto del leccionario completo: '));
    var l = el('a', '', 'lecturas del día en dominicos.org');
    l.href = 'https://www.dominicos.org/predicacion/evangelio-del-dia/' + dd + '/'; l.target = '_blank'; l.rel = 'noopener';
    p1.appendChild(l); p1.appendChild(document.createTextNode('.'));
    f.appendChild(p1);
    f.appendChild(el('p', '', 'Las citas siguen la ordenación de las lecturas de la Misa y el calendario litúrgico de España. Cada cita abre su capítulo en la Sagrada Biblia de la Conferencia Episcopal Española. Los salmos llevan la numeración del leccionario.'));
    f.appendChild(el('p', 'amen', 'Palabra de Dios'));
  }

  readHash();
  window.addEventListener('hashchange', function () { readHash(); state.mass = null; renderDays(); render(); });
  renderDays();
  render();
})();
</script>

</body></html>
