<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Misal diario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Lecturas de la Misa y Liturgia de las Horas de cada día según el calendario litúrgico de España">
<meta name="theme-color" content="#f5eedd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1712" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Misal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Composición: una página de misal de bolsillo, columna única centrada, cinta marcapáginas del color litúrgico del día */
:root {
  --paper: #f5eedd;
  --paper-deep: #ece2c9;
  --paper-edge: #e3d6b8;
  --slip: #fbf6ea;
  --ink: #2b2118;
  --ink-soft: #6e5f4b;
  --rubric: #a52a20;
  --gilt: #a8843c;
  --rule: rgba(43, 33, 24, 0.16);
  --chip: #efe6d0;
  --chip-on: #2b2118;
  --chip-on-ink: #f5eedd;
  --lit-verde: #4d7a46;
  --lit-morado: #6a3d78;
  --lit-blanco: #e7d9a8;
  --lit-blanco-edge: #b99a52;
  --lit-rojo: #b0302a;
  --lit-rosa: #d58ea3;
  --lit-negro: #3a3532;
  --sheet: #ffffff;
  --sheet-ink: #2b2118;
  --sheet-soft: #6e5f4b;
  --sheet-rubric: #a52a20;
  --sheet-gilt: #a8843c;
  --sheet-rule: #e2d9ca;
  --sheet-slip: #faf6ee;
  --font-display: "IM Fell English", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-sc: "IM Fell English SC", "EB Garamond", Garamond, serif;
  --font-body: "EB Garamond", Garamond, "Iowan Old Style", "Times New Roman", serif;
  --step--1: 0.875rem;
  --step-0: 1.125rem;
  --step-1: 1.375rem;
  --step-2: 1.75rem;
  --step-3: 2.25rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c1712; --paper-deep: #241e17; --paper-edge: #2e261d; --slip: #241e17;
    --ink: #ece2cd; --ink-soft: #b4a68e; --rubric: #e27a6c; --gilt: #c9a45c;
    --rule: rgba(236, 226, 205, 0.16); --chip: #2a231b; --chip-on: #ece2cd; --chip-on-ink: #1c1712;
    --lit-verde: #6e9d66; --lit-morado: #9a72a8; --lit-blanco: #e7d9a8; --lit-blanco-edge: #c9a45c;
    --lit-rojo: #d4554b; --lit-rosa: #e3a2b5; --lit-negro: #8a827c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c1712; --paper-deep: #241e17; --paper-edge: #2e261d; --slip: #241e17;
  --ink: #ece2cd; --ink-soft: #b4a68e; --rubric: #e27a6c; --gilt: #c9a45c;
  --rule: rgba(236, 226, 205, 0.16); --chip: #2a231b; --chip-on: #ece2cd; --chip-on-ink: #1c1712;
  --lit-verde: #6e9d66; --lit-morado: #9a72a8; --lit-blanco: #e7d9a8; --lit-blanco-edge: #c9a45c;
  --lit-rojo: #d4554b; --lit-rosa: #e3a2b5; --lit-negro: #8a827c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  background-image:
    radial-gradient(120% 70% at 50% 0%, transparent 55%, var(--paper-deep) 100%),
    radial-gradient(90% 60% at 50% 100%, transparent 50%, var(--paper-edge) 130%);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
  min-height: 100vh;
}
.page {
  position: relative;
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 1.5rem 3rem;
}

/* Cinta marcapáginas */
.ribbon {
  position: absolute;
  top: 0;
  right: max(22px, calc(env(safe-area-inset-right, 0px) + 10px));
  width: 16px;
  height: 92px;
  background: var(--ribbon, var(--lit-verde));
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%);
  transition: background-color 0.5s ease;
  box-shadow: inset 2px 0 0 rgba(255, 255, 255, 0.18), inset -2px 0 0 rgba(0, 0, 0, 0.12);
}
.ribbon.white { background: var(--lit-blanco); box-shadow: inset 0 0 0 1px var(--lit-blanco-edge); }

/* Cabecera y pestañas */
.masthead { text-align: center; padding-inline: 1.5rem; }
.tabs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 0.9rem; margin: 0; }
.tab[data-tab="lecturas"] { justify-self: end; }
.tab[data-tab="horas"] { justify-self: start; }
@media (max-width: 370px) { .tab { font-size: 1rem; letter-spacing: 0.1em; } .tabs { gap: 0.7rem; } }
.tab {
  font-family: var(--font-sc);
  font-size: var(--step-0);
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  background: none;
  border: 0;
  padding: 0.3rem 0.1rem 0.25rem;
  cursor: pointer;
  border-bottom: 1px solid transparent;
}
.tab[aria-selected="true"] { color: var(--rubric); border-bottom-color: var(--rubric); }
.tabs .sep { color: var(--gilt); font-size: 0.85rem; }
.fleuron { display: flex; align-items: center; gap: 0.75rem; color: var(--gilt); margin: 0.5rem auto 0; max-width: min(15rem, calc(100% - 6rem)); }
.fleuron .orn { font-size: 0.9rem; line-height: 1; }
.fleuron::before, .fleuron::after { content: ""; flex: 1; height: 0; border-top: 1px solid var(--gilt); border-bottom: 1px solid var(--gilt); padding-top: 2px; opacity: 0.75; }
.sh { width: 1.7rem; height: 1.7rem; flex: 0 0 auto; display: block; }
.sh-g { fill: var(--gilt); }
.sh-h { fill: var(--lit-rojo); }
.sh-t { fill: none; stroke: var(--gilt); stroke-width: 1.1; stroke-linecap: round; }

/* Selector de días */
.days {
  margin: 1.5rem 0 0;
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  padding: 0.25rem 0.1rem 0.6rem;
  scrollbar-width: thin;
}
.day {
  flex: 0 0 auto;
  scroll-snap-align: start;
  min-width: 3.6rem;
  display: grid;
  justify-items: center;
  gap: 0.1rem;
  padding: 0.45rem 0.55rem 0.5rem;
  border: 1px solid var(--rule);
  border-radius: 0.6rem;
  background: var(--chip);
  color: var(--ink);
  font-family: var(--font-body);
  cursor: pointer;
  font-variant-numeric: lining-nums tabular-nums;
}
.day .wd { font-size: 0.8rem; font-variant-caps: all-small-caps; letter-spacing: 0.08em; color: var(--ink-soft); }
.day .num { font-size: 1.35rem; line-height: 1.1; font-weight: 500; }
.day .bar { width: 1.4rem; height: 4px; border-radius: 2px; background: var(--c, var(--lit-verde)); }
.day .bar.white { background: var(--lit-blanco); box-shadow: inset 0 0 0 1px var(--lit-blanco-edge); }
.day[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.day[aria-pressed="true"] .wd { color: var(--chip-on-ink); opacity: 0.8; }
.day:focus-visible, .other:focus-within, .pill:focus-visible, .tab:focus-visible, .opt:focus-visible, a:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.other {
  position: relative;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  min-width: 4.4rem;
  padding: 0.45rem 0.6rem;
  border: 1px dashed var(--rule);
  border-radius: 0.6rem;
  color: var(--ink-soft);
  font-size: 0.85rem;
  line-height: 1.15;
  text-align: center;
  cursor: pointer;
}
.other input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

/* Día litúrgico */
.today { margin-top: 1.6rem; }
.date { font-style: italic; color: var(--ink-soft); margin: 0; }
.title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--step-3);
  line-height: 1.12;
  margin: 0.35rem 0 0;
  text-wrap: balance;
}
.ini { color: var(--rubric); font-size: 1.32em; line-height: 0.8; }
.sub { font-family: var(--font-display); font-style: italic; font-size: var(--step-1); color: var(--ink-soft); margin: 0.3rem 0 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.9rem; margin: 0.9rem 0 0; }
.rank { font-family: var(--font-sc); color: var(--rubric); letter-spacing: 0.1em; font-size: 1.05rem; }
.color { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--ink-soft); font-size: 1rem; }
.color i { width: 0.8rem; height: 0.8rem; border-radius: 50%; background: var(--c); display: inline-block; }
.color i.white { background: var(--lit-blanco); box-shadow: inset 0 0 0 1px var(--lit-blanco-edge); }
.cycle { color: var(--ink-soft); font-size: 1rem; font-variant-numeric: lining-nums; }
.extra { margin: 0.6rem 0 0; color: var(--ink-soft); font-size: 1rem; }
.extra b { font-weight: 400; font-variant-caps: all-small-caps; letter-spacing: 0.06em; color: var(--rubric); }
.temporal { font-style: italic; color: var(--ink-soft); margin: 0.35rem 0 0; }

.pills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 1.4rem 0 0; }
.pill {
  font: inherit;
  font-size: 0.95rem;
  padding: 0.3rem 0.8rem;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.pill small { color: var(--ink-soft); font-style: italic; margin-left: 0.25rem; }
.pill[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.pill[aria-pressed="true"] small { color: var(--chip-on-ink); opacity: 0.75; }
.hours { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.4rem; margin: 1.4rem 0 0; }
.hours .pill { display: grid; justify-items: center; padding: 0.4rem 0.3rem; border-radius: 0.6rem; line-height: 1.2; }
.hours .pill small { margin: 0; font-size: 0.8rem; }
.note { margin: 1.1rem 0 0; font-style: italic; color: var(--ink-soft); font-size: 1rem; }

/* Lecturas */
.readings, .steps { list-style: none; margin: 1.25rem 0 0; padding: 0; }
.reading { padding: 1.2rem 0 1.25rem; border-top: 1px solid var(--rule); }
.reading:first-child { border-top: 0; }
.label { font-family: var(--font-sc); color: var(--rubric); letter-spacing: 0.12em; font-size: 1rem; margin: 0; }
.rtitle { font-style: italic; margin: 0.2rem 0 0; color: var(--ink); }
.rtitle .cross { color: var(--rubric); font-style: normal; margin-right: 0.3rem; }
.cite {
  display: block;
  font-size: var(--step-2);
  line-height: 1.2;
  margin: 0.35rem 0 0;
  font-variant-numeric: lining-nums;
  font-weight: 500;
  overflow-wrap: anywhere;
}
.resp { margin: 0.2rem 0 0; font-size: 1.05rem; color: var(--ink-soft); font-variant-numeric: lining-nums; }
.resp .rsym { color: var(--rubric); font-size: 1.15em; }
.read {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  margin-top: 0.55rem;
  color: var(--rubric);
  text-decoration: none;
  font-size: 1rem;
  border-bottom: 1px solid currentColor;
  padding-bottom: 1px;
}
.read svg { width: 0.85em; height: 0.85em; }
.alts { margin: 0.7rem 0 0; font-size: 1rem; color: var(--ink-soft); }
.alts a { color: inherit; }
.alts em { font-variant-caps: all-small-caps; font-style: normal; letter-spacing: 0.06em; color: var(--rubric); }

/* Horas */
.choice { margin: 1.3rem 0 0; }
.choice .label { margin-bottom: 0.45rem; }
.opts { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.opt {
  font: inherit; font-size: 0.95rem; text-align: left; line-height: 1.25;
  padding: 0.35rem 0.75rem; border-radius: 0.6rem; border: 1px solid var(--rule);
  background: transparent; color: var(--ink); cursor: pointer; max-width: 100%;
}
.opt[aria-pressed="true"] { border-color: var(--rubric); color: var(--rubric); box-shadow: inset 0 0 0 1px var(--rubric); }
.hour { margin-top: 1.6rem; }
.hname { font-family: var(--font-display); font-weight: 400; font-size: var(--step-3); line-height: 1.1; margin: 0; }
.office { font-style: italic; color: var(--ink-soft); margin: 0.3rem 0 0; text-wrap: pretty; }
.slip {
  margin: 1.2rem 0 0;
  padding: 0.85rem 1rem 0.9rem;
  background: var(--slip);
  border: 1px solid var(--rule);
  border-radius: 0.5rem;
}
.slip h3 { font-family: var(--font-sc); font-weight: 400; color: var(--rubric); letter-spacing: 0.12em; font-size: 1rem; margin: 0 0 0.5rem; }
.tomo { display: grid; grid-template-columns: 1.2rem 1fr; gap: 0.6rem; align-items: start; padding-bottom: 0.65rem; margin-bottom: 0.7rem; border-bottom: 1px solid var(--rule); }
.tomo svg { width: 1.2rem; height: 1.2rem; color: var(--rubric); margin-top: 0.12rem; }
.tomo b { display: block; font-weight: 500; line-height: 1.25; }
.tomo span { display: block; color: var(--ink-soft); font-size: 1rem; line-height: 1.3; }
.marks { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.45rem; }
.marks li { display: grid; grid-template-columns: 10px 1fr; gap: 0.7rem; align-items: start; }
.marks .tape { width: 10px; height: 1.6rem; margin-top: 0.1rem; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }
.marks .t0 { background: var(--lit-rojo); }
.marks .t1 { background: var(--lit-verde); }
.marks .t2 { background: var(--gilt); }
.marks .t3 { background: var(--lit-morado); }
.marks .t4 { background: var(--lit-blanco); box-shadow: inset 0 0 0 1px var(--lit-blanco-edge); }
.marks b { display: block; font-weight: 500; line-height: 1.25; }
.marks span { display: block; color: var(--ink-soft); font-size: 1rem; line-height: 1.3; }
.rule { margin: 1rem 0 0; font-size: 1rem; line-height: 1.45; padding-left: 0.85rem; border-left: 2px solid var(--rubric); }
.rule b { font-weight: 400; font-variant-caps: all-small-caps; letter-spacing: 0.06em; color: var(--rubric); }
.pre { margin: 1rem 0 0; font-size: 1rem; font-style: italic; color: var(--rubric); }
.step { display: grid; grid-template-columns: 1.6rem 1fr; gap: 0 0.6rem; padding: 0.85rem 0; border-top: 1px solid var(--rule); }
.step:first-child { border-top: 0; }
.step .n { font-family: var(--font-display); color: var(--rubric); font-size: 1.1rem; line-height: 1.6; text-align: right; font-variant-numeric: lining-nums; }
.step .body { min-width: 0; }
.step .src { font-style: italic; }
.step p { margin: 0.15rem 0 0; }
.step.opt-step .label::after { content: " · si se desea"; font-family: var(--font-body); font-style: italic; letter-spacing: 0; color: var(--ink-soft); font-variant-caps: normal; }
.refs { display: flex; flex-wrap: wrap; gap: 0.3rem 0.45rem; margin: 0.35rem 0 0.15rem; padding: 0; list-style: none; }
.refs li { font-size: 1.1rem; font-weight: 500; padding: 0.05rem 0.55rem; border-radius: 0.4rem; background: var(--chip); font-variant-numeric: lining-nums; white-space: nowrap; }

.closing { margin-top: 2rem; padding-top: 1.25rem; border-top: 3px double var(--gilt); }
.closing p { margin: 0 0 0.75rem; font-size: 1rem; color: var(--ink-soft); }
.closing a { color: var(--rubric); }
.amen { text-align: center; font-family: var(--font-display); font-style: italic; color: var(--gilt); margin-top: 1.5rem !important; }


/* Herramientas: imprimir y tema */
.themebtn .sun { display: none; }
.themebtn.is-dark .sun { display: inline; }
.themebtn.is-dark .moon { display: none; }
.tools { position: absolute; top: 0.95rem; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 0.2rem; }
.printbtn {
  display: grid; justify-items: center; gap: 0.05rem; width: 2.9rem; padding: 0.2rem 0;
  background: none; border: 0; color: var(--ink-soft); cursor: pointer; font-family: var(--font-sc); font-size: 0.72rem; letter-spacing: 0.08em;
}
.printbtn svg { width: 1.35rem; height: 1.35rem; }
.themebtn svg { width: 1.2rem; height: 1.2rem; }
.printbtn:hover, .printbtn:focus-visible { color: var(--rubric); }
.printbtn:focus-visible, .pr-close:focus-visible, .pr-kind:focus-visible, .pr-field input:focus-visible, .pr-field select:focus-visible, .pr-btn:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.printer {
  position: fixed; inset: 0; z-index: 50; background: var(--paper); overflow-y: auto; overscroll-behavior: contain;
  padding-top: env(safe-area-inset-top, 0px);
}
.pr-page { max-width: 34rem; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 1.2rem 7rem; }
.pr-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.pr-close { font: inherit; font-size: 1.8rem; line-height: 1; width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; }
.pr-sec { margin-top: 1.5rem; }
.pr-sec > .label { margin-bottom: 0.5rem; }
.pr-kinds { display: grid; gap: 0.5rem; }
.pr-kind { font: inherit; text-align: left; padding: 0.6rem 0.85rem; border-radius: 0.6rem; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; display: grid; gap: 0.1rem; }
.pr-kind b { font-weight: 500; }
.pr-kind span { color: var(--ink-soft); font-style: italic; font-size: 0.95rem; line-height: 1.3; }
.pr-kind[aria-pressed="true"] { border-color: var(--rubric); box-shadow: inset 0 0 0 1px var(--rubric); }
.pr-kind[aria-pressed="true"] b { color: var(--rubric); }
.pr-field { display: grid; gap: 0.25rem; margin-top: 0.75rem; }
.pr-field > span { font-size: 0.95rem; color: var(--ink-soft); }
.pr-field input, .pr-field select {
  font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--slip); border: 1px solid var(--rule); border-radius: 0.45rem; padding: 0.45rem 0.6rem; width: 100%; min-width: 0;
}
.pr-readings { list-style: none; margin: 0.9rem 0 0; padding: 0; display: grid; gap: 0.6rem; counter-reset: rd; }
.pr-reading { border: 1px solid var(--rule); border-radius: 0.6rem; padding: 0.6rem 0.7rem 0.7rem; background: var(--slip); }
.pr-reading .pr-field { margin-top: 0.45rem; }
.pr-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 0.5rem; }
.pr-tools { display: flex; justify-content: flex-end; gap: 0.3rem; margin-top: 0.5rem; }
.pr-btn { font: inherit; font-size: 0.95rem; padding: 0.3rem 0.7rem; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; }
.pr-btn[disabled] { opacity: 0.4; cursor: default; }
.pr-add { margin-top: 0.7rem; color: var(--rubric); border-color: var(--rubric); }
.pr-hint { margin: 0.6rem 0 0; font-size: 0.95rem; font-style: italic; color: var(--ink-soft); }
.pr-preview { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
.pr-pages { margin: 0; font-size: 0.95rem; font-style: italic; color: var(--ink-soft); }
.pr-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--paper); border-top: 1px solid var(--rule);
  padding: 0.7rem max(20px, env(safe-area-inset-right, 0px)) calc(0.7rem + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}
.pr-bar-in { max-width: 34rem; margin: 0 auto; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }

<script>/* Motor del calendario litúrgico (Rito romano, calendario de España).

          setAll(P, 'Propio del tiempo');
          P.antifonas = sk.type === 'dec17' ? 'las propias de la feria (Propio del tiempo)' : d.season === 'semanasanta' ? 'las propias (Propio del tiempo)' : 'las del salterio';
          if (sk.type === 'dec17' && O_ANT[d.date[2]]) P.cantico = 'Propio del tiempo: la antífona ' + O_ANT[d.date[2]];
          P.psalms = PS[w].V[dow];
          marksAdd(P.marks, 'Salterio', DN[dow] + ', semana ' + R[w]);
          marksAdd(P.marks, 'Propio del tiempo', ptLabel(d));
          break;
        case 'strongsun':
          P.office = 'II Vísperas del ' + d.principal.name;
          setAll(P, 'Propio del tiempo');
          P.antifonas = 'las propias del domingo (Propio del tiempo)';
          P.psalms = PS[w].V2.slice(); P.psalmsFrom = 'del salterio, domingo de la semana ' + R[w] + ', II Vísperas';
          oAnt(P, d.date);
          if (d.season === 'cuaresma' || d.season === 'semanasanta') { P.psalms[2] = LENT_V2; P.notes.push('En Cuaresma el cántico del final es el de la primera carta de Pedro, que el salterio indica en lugar del Apocalipsis.'); }
          marksAdd(P.marks, 'Propio del tiempo', ptLabel(d));
          marksAdd(P.marks, 'Salterio', 'domingo, semana ' + R[w] + ', II Vísperas');
          break;
        case 'tsol': case 'tfeast':
          P.office = (d.principal.rank <= 4 || d.dow === 0 ? 'II Vísperas ' : 'Vísperas ') + (/^Domingo/.test(d.principal.name) ? 'del ' + d.principal.name : deDel(d.principal.name));
          setAll(P, 'Propio del tiempo');
          P.antifonas = 'las propias (Propio del tiempo)'; P.psalmsFrom = 'propios (Propio del tiempo)';
          marksAdd(P.marks, 'Propio del tiempo', ptLabel(d) + (d.principal.rank <= 4 || d.dow === 0 ? ', II Vísperas' : ''));
          break;
        case 'octnav':
          P.office = 'Vísperas de la octava de Navidad · ' + d.date[2] + ' de diciembre';
          setAll(P, 'Propio del tiempo');
          P.antifonas = 'las de las II Vísperas de Navidad';
          P.psalms = XMAS_V2; P.psalmsFrom = 'de las II Vísperas de Navidad';
          marksAdd(P.marks, 'Propio del tiempo', 'Navidad, II Vísperas (salmodia)');
          marksAdd(P.marks, 'Propio del tiempo', d.date[2] + ' de diciembre');
          if (sk.feastDay) P.notes.push('Las Vísperas de hoy son de la octava de Navidad, no de la fiesta del santo.');
          break;
        case 'octpas':
          P.office = 'Vísperas · ' + d.temporal.name;
          setAll(P, 'Propio del tiempo');
          P.antifonas = 'las del domingo de Pascua (Propio del tiempo)';
          P.responsorio = 'En su lugar se dice la antífona «Este es el día en que actuó el Señor…»';
          P.psalms = PS[1].V2; P.psalmsFrom = 'de las Vísperas del domingo de Pascua';
          marksAdd(P.marks, 'Propio del tiempo', 'domingo de Pascua y ' + lc(d.temporal.name));
          break;
        case 'triduo':
          return triduo(d, 'visperas');
        case 'ssol': case 'sfeast': {
          var solemn = sk.type === 'ssol';
          P.office = (solemn || d.dow === 0 ? 'II Vísperas ' : 'Vísperas ') + deDel(sk.saint.name);
          var com = saintPlan(P, sk, d, 'Vísperas', w, 'feast');
          P.antifonas = com ? 'propias o del común' : 'las propias';
          P.psalmsFrom = com ? 'propios o, si no los tiene, del común' : 'propios';
          break;
        }
        case 'mem':
          P.office = 'Vísperas de la ' + (sk.optional ? 'memoria libre ' : 'memoria ') + deDel(sk.saint.name);
          saintPlan(P, sk, d, 'Vísperas', w, 'mem');
          P.psalms = PS[w].V[dow];
          break;
        case 'bvmsat':
          return visperas(n, 'feria');
        case 'difuntos':
          P.office = 'Vísperas · Conmemoración de todos los fieles difuntos';
          setAll(P, 'Oficio de difuntos');
          P.antifonas = 'las del Oficio de difuntos'; P.psalmsFrom = 'del Oficio de difuntos (Vísperas)';
          P.oracion = 'Propio de los santos (2 de noviembre)';
          marksAdd(P.marks, 'Oficio de difuntos', 'Vísperas');
          break;
      }
      commemoration(d, P);
      return finish(d, seasonNotes(d, P));
    }

    function oAnt(P, dd) { if (dd[1] === 12 && O_ANT[dd[2]]) P.cantico = 'Propio del tiempo: la antífona ' + O_ANT[dd[2]] + ' (' + dd[2] + ' de diciembre)'; }
    function firstVespers(e, d) {
      var sk = kindOf(e), w = psalterWeek(e);
      var P = { hour: 'visperas', marks: [], notes: [], first: true, psalterWeek: w };
      P.office = 'I Vísperas ' + (/^(La|El|Los|Las) /.test(e.principal.name) || e.principal.kind !== 'temporal' ? deDel(e.principal.name) : 'del ' + e.principal.name);
      switch (sk.type) {
        case 'otsun':
          setAll(P, 'Salterio');
          P.cantico = 'Propio del tiempo, la del ciclo ' + e.sunCycle; P.oracion = 'Propio del tiempo';
          P.psalms = PS[w].V1;
          marksAdd(P.marks, 'Salterio', 'domingo, semana ' + R[w] + ', I Vísperas');
          marksAdd(P.marks, 'Propio del tiempo', ptLabel(e) + ', ciclo ' + e.sunCycle);
          break;
        case 'strongsun':
          setAll(P, 'Propio del tiempo');
          P.antifonas = 'las propias del domingo (Propio del tiempo)';
          P.psalms = PS[w].V1; P.psalmsFrom = 'del salterio, domingo de la semana ' + R[w] + ', I Vísperas';
          if (d) oAnt(P, d.date);
          marksAdd(P.marks, 'Propio del tiempo', ptLabel(e) + ', I Vísperas');
          marksAdd(P.marks, 'Salterio', 'domingo, semana ' + R[w] + ', I Vísperas');

        case 'ssol': case 'sfeast': {
          var com = saintPlan(P, sk, e, 'I Vísperas', w, 'feast');

          P.psalmsFrom = com ? 'propios o, si no los tiene, del común (I Vísperas)' : 'propios';

        }
        default:
          setAll(P, 'Propio del tiempo');
          P.antifonas = 'las propias (Propio del tiempo)'; P.psalmsFrom = 'propios (Propio del tiempo)';
          marksAdd(P.marks, 'Propio del tiempo', ptLabel(e) + ', I Vísperas');
      }
      P.notes.push('Esta tarde ya empieza la celebración de mañana: se rezan sus primeras Vísperas.');
      return finish(e, seasonNotes(e, P));
    }

    function triduo(d, hour) {
      var k = d.temporal.key, P = { hour: hour, marks: [], notes: [], psalterWeek: 2, lent: true };
      var lbl = { JUEVES: 'Jueves Santo', VIERNES: 'Viernes Santo', VIGILIA: 'Sábado Santo' }[k];
      P.office = (hour === 'laudes' ? 'Laudes del ' : 'Vísperas del ') + lbl;
      setAll(P, 'Propio del tiempo');
      P.antifonas = 'las propias (Propio del tiempo)'; P.psalmsFrom = 'los que indica el Propio del tiempo';
      P.responsorio = 'En su lugar se dice la antífona «Cristo se hizo por nosotros obediente…»';
      marksAdd(P.marks, 'Propio del tiempo', lbl);
      if (hour === 'visperas' && k === 'JUEVES') P.notes.push('Estas Vísperas solo las rezan quienes no participan en la Misa vespertina de la Cena del Señor.');
      if (hour === 'visperas' && k === 'VIERNES') P.notes.push('Estas Vísperas solo las rezan quienes no participan en la celebración de la Pasión del Señor.');
      return finish(d, P);
    }

    function commemoration(d, P) {
      if (!d.commemorationItems || !d.commemorationItems.length) return;
      var c = d.commemorationItems[0];
      P.commem = 'Hoy se puede hacer conmemoración de ' + c.name + ': después de la oración, omitiendo su conclusión, se añaden la antífona (propia o del común) y la oración del santo (' + PSANT(c) + ').';
    }

    // ---------- Completas ----------
    function completas(n, choice, now) {
      var d = dayOf(n), e = dayOf(n + 1), k = d.temporal.key;
      var which, notes = [], fvw = firstVespersWin(d, e, choice);
      var tc = fvw ? tomoOf(e) : tomoOf(d);
      if (tc !== tomoOf(d)) notes.push('Estas Completas, como las Vísperas de esta tarde, ya se rezan con el ' + TOMOS[tc].name + '.');
      if (fvw) which = 'domI';
      else if (k === 'JUEVES' || k === 'VIERNES' || k === 'VIGILIA') which = 'domII';
      else if (inOctave(d)) { which = 'domII'; notes.push('Durante la octava se rezan las Completas del domingo, después de las I o de las II Vísperas, a elección.'); }
      else if (d.dow === 0 || (d.principal.kind === 'sanctoral' && d.principal.rank <= 4 && d.principal.id !== 'commemoration_of_all_the_faithful_departed') ||
        (d.principal.kind === 'temporal' && TSOL[k])) which = 'domII';
      else which = d.dow;
      var c = COMP[which];
      var easter = d.season === 'pascua';
      var lent = d.season === 'cuaresma' || d.season === 'semanasanta' || d.season === 'triduo';
      if (k === 'VIGILIA') notes.push('Quienes participan en la Vigilia pascual no rezan estas Completas.');
      if (now != null && now < 4) notes.push('Pasada la medianoche, si todavía no te has acostado, reza las Completas del día anterior.');
      var steps = [
        { part: 'Invocación', text: '«Dios mío, ven en mi auxilio. — Señor, date prisa en socorrerme.» Gloria al Padre' + (lent ? '. En Cuaresma no se dice aleluya.' : ' y aleluya.') },
        { part: 'Examen de conciencia', text: 'Un momento de silencio para repasar el día. Puede seguir un acto penitencial, como el «Yo confieso».' },
        { part: 'Himno', text: 'Uno de los himnos de Completas que trae tu libro' + (easter ? ' (en tiempo pascual, el propio de este tiempo).' : '.') },
        { part: 'Salmodia', refs: c.ps, text: 'Cada salmo con su antífona y el Gloria al Padre al final.' },
        { part: 'Lectura breve', text: 'La de estas mismas Completas.' },
        { part: 'Responsorio breve', text: k === 'JUEVES' || k === 'VIERNES' || k === 'VIGILIA' ? 'En su lugar se dice la antífona «Cristo se hizo por nosotros obediente…» (Propio del tiempo).' :
          (/^PAS1-/.test(k) ? 'En su lugar se dice la antífona «Este es el día en que actuó el Señor…».' : '«En tus manos, Señor, encomiendo mi espíritu…»' + (easter ? ', con aleluya.' : '.')) },
        { part: 'Cántico evangélico', text: 'Cántico de Simeón, «Ahora, Señor, según tu promesa, puedes dejar a tu siervo irse en paz» (Lc 2, 29-32). Antífona: «Sálvanos, Señor, despiertos, protégenos mientras dormimos…»' + (easter ? ', con aleluya.' : '.') },
        { part: 'Oración', text: 'La de estas mismas Completas.' },
        { part: 'Bendición', text: '«El Señor todopoderoso nos conceda una noche tranquila y una santa muerte. — Amén.»' },
        { part: 'Antífona de la Virgen', text: easter ? '«Reina del cielo, alégrate, aleluya».' : 'La Salve u otra de las antífonas marianas del libro.' }
      ];
      return {
        hour: 'completas', office: 'Completas ' + c.title, notes: notes, steps: steps, tomo: tomoInfo(tc),
        marks: [{ book: 'Completas', place: c.title.replace(/^del /, '') }]

    }

    // ---------- Montaje de los pasos ----------
    function antTxt(a) { return a === 'Salterio' ? 'las del salterio' : a === 'Propio del tiempo' ? 'las propias (Propio del tiempo)' : a; }
    function dot(t) { return /[.»…]$/.test(t) ? t : t + '.'; }
    function finish(d, P) {
      fixBook(d, P);
      var lent = P.lent || d.season === 'cuaresma' || d.season === 'semanasanta';
      var steps = [];
      steps.push({ part: 'Invocación', text: '«Dios mío, ven en mi auxilio. — Señor, date prisa en socorrerme.» Gloria al Padre' + (lent ? '. En Cuaresma no se dice aleluya.' : ' y aleluya.') });

      steps.push({ part: 'Lectura breve', src: P.lectura });
      if (/^En su lugar/.test(P.responsorio)) steps.push({ part: 'Responsorio breve', text: dot(P.responsorio) });

      steps.push({ part: 'Cántico evangélico', text: (P.hour === 'laudes'

        : 'Magníficat, «Proclama mi alma la grandeza del Señor» (Lc 1, 46-55), en el Ordinario.') + ' Antífona: ' + dot(lcFirst(P.cantico)) });
      steps.push({ part: 'Preces', src: P.preces, text: P.hour === 'visperas' ? 'La última intención es siempre por los difuntos.' : null });
      steps.push({ part: 'Padrenuestro', text: 'Con la invitación que lo introduce.' });
      steps.push({ part: 'Oración', src: P.oracion });
      if (P.commem) steps.push({ part: 'Conmemoración', text: P.commem, optional: true });
      steps.push({ part: 'Conclusión', text: 'Si no preside un sacerdote o diácono: «El Señor nos bendiga, nos guarde de todo mal y nos lleve a la vida eterna. — Amén.»' });
      var pre = null;
      if (P.hour === 'laudes') pre = 'Si es tu primera oración del día, empieza con el Invitatorio (en el Ordinario): «Señor, ábreme los labios. — Y mi boca proclamará tu alabanza», y el salmo 94 con su antífona (' + lcFirst(P.invit || P.himno) + '). Después pasa directamente al himno.';
      return { hour: P.hour, office: P.office, psalterWeek: P.psalterWeek, tomo: tomoInfo(tomoOf(d)), marks: P.marks, notes: P.notes, rule: P.rule || null, steps: steps, pre: pre, first: !!P.first };
    }

    function options(d) {

    return {
      forDay: function (n, choice, nowHour) {
        var d = dayOf(n);
        return { psalterWeek: psalterWeek(d), tomo: tomoInfo(tomoOf(d)), options: options(d), laudes: laudes(d, choice), visperas: visperas(n, choice), completas: completas(n, choice, nowHour) };
      },

  }

  var api = { create: create, PS: PS, TOMOS: TOMOS };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Horas = api;
})(this);

<script>
(function () {
  'use strict';
  var Lit = window.Liturgia, Lec = window.Lecturas;
  var SANT = window.SANTORAL.map(function (a) { return { id: a[0], m: a[1], d: a[2], rank: a[3], color: a[4], name: a[5] }; });
  var Cal = Lit.create(SANT, Lit.CFG_ES);
  var Hor = window.Horas.create(Cal, Lit, SANT, window.COMMONS);
  var MESES = Lit.MESES, DIAS = Lit.DIAS;
  var DIAS_C = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  var COLOR_VAR = { verde: '--lit-verde', morado: '--lit-morado', blanco: '--lit-blanco', rojo: '--lit-rojo', rosa: '--lit-rosa', negro: '--lit-negro' };
  var CYCLE_TXT = { I: 'año impar (I)', II: 'año par (II)' };
  var ROM = ['', 'I', 'II', 'III', 'IV'];
  var HOURS = [
    { id: 'laudes', name: 'Laudes', when: 'mañana' },
    { id: 'visperas', name: 'Vísperas', when: 'tarde' },
    { id: 'completas', name: 'Completas', when: 'noche' }
  ];

  // ---- Fecha de hoy: se recalcula siempre, nunca se guarda en la dirección ----
  function todayN() { var d = new Date(); return Lit.dn(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
  var T0, END;
  function setToday() { T0 = todayN(); END = T0 + 7; while (Lit.dow(END) !== 0) END++; }
  setToday();

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var state = { n: T0, tab: store('misal.tab') === 'horas' ? 'horas' : 'lecturas', mass: null, hour: null, hourAt: 0, choice: null };

  // Limpia direcciones antiguas que llevaban la fecha (#2026-10-18) para que siempre se abra hoy
  if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }

  function ymdStr(n) { var a = Lit.ymd(n); return a[0] + '-' + String(a[1]).padStart(2, '0') + '-' + String(a[2]).padStart(2, '0'); }
  function dayOf(n) { var a = Lit.ymd(n); return Cal.day(a[0], a[1], a[2]); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function colorize(node, color) {
    if (color === 'blanco') node.classList.add('white');
    else node.style.setProperty('--c', 'var(' + (COLOR_VAR[color] || '--lit-verde') + ')');
  }
  function autoHour() {
    var h = new Date().getHours();
    if (state.n !== T0) return 'laudes';
    if (h >= 4 && h < 13) return 'laudes';
    if (h >= 13 && h < 21) return 'visperas';
    return 'completas';
  }
  function currentHour() {
    if (state.hour && Date.now() - state.hourAt < 30 * 60 * 1000) return state.hour;
    return autoHour();
  }

  // ---- Tema claro / oscuro (se recuerda en este navegador) ----
  var rootEl = document.documentElement, mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effTheme() { var t = rootEl.getAttribute('data-theme'); if (t === 'dark' || t === 'light') return t; return mq && mq.matches ? 'dark' : 'light'; }
  function paintTheme() {
    var dark = effTheme() === 'dark', b = document.getElementById('themebtn');
    b.classList.toggle('is-dark', dark);
    var lbl = dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
    b.setAttribute('aria-label', lbl); b.title = lbl;
    document.getElementById('themelbl').textContent = dark ? 'Claro' : 'Oscuro';
    Array.prototype.forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function (m) { m.setAttribute('content', dark ? '#1c1712' : '#f5eedd'); });
  }
  document.getElementById('themebtn').addEventListener('click', function () {
    var next = effTheme() === 'dark' ? 'light' : 'dark';
    rootEl.setAttribute('data-theme', next); store('misal.theme', next); paintTheme();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', paintTheme);
  if (window.MutationObserver) new MutationObserver(paintTheme).observe(rootEl, { attributes: true, attributeFilter: ['data-theme'] });
  paintTheme();

  // ---- Pestañas ----
  function renderTabs() {
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === state.tab ? 'true' : 'false');
      b.tabIndex = b.dataset.tab === state.tab ? 0 : -1;
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.addEventListener('click', function () {
      state.tab = b.dataset.tab; store('misal.tab', state.tab);
      renderTabs(); render();
    });
  });

  // ---- Selector de días ----
  function renderDays() {
    var nav = document.getElementById('days');
    nav.textContent = '';
    for (var n = T0; n <= END; n++) {
      var d = dayOf(n), a = Lit.ymd(n);
      var b = el('button', 'day');
      b.type = 'button';
      b.id = 'day-' + ymdStr(n);
      b.dataset.n = n;
      b.setAttribute('aria-pressed', n === state.n ? 'true' : 'false');
      var label = n === T0 ? 'hoy' : (n === T0 + 1 ? 'mañana' : DIAS_C[d.dow]);
      b.setAttribute('aria-label', DIAS[d.dow] + ' ' + a[2] + ' de ' + MESES[a[1]] + ': ' + d.principal.name);
      b.appendChild(el('span', 'wd', label));
      b.appendChild(el('span', 'num', String(a[2])));
      var bar = el('span', 'bar'); colorize(bar, d.principal.color); b.appendChild(bar);
      b.addEventListener('click', function () { go(+this.dataset.n); });
      nav.appendChild(b);
    }
    var other = el('label', 'other');
    other.appendChild(el('span', '', 'Otra fecha'));
    var inp = document.createElement('input');
    inp.type = 'date'; inp.id = 'otra-fecha'; inp.setAttribute('aria-label', 'Elegir otra fecha');
    inp.value = ymdStr(state.n);
    inp.addEventListener('change', function () {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(inp.value);
      if (m) go(Lit.dn(+m[1], +m[2], +m[3]));
    });
    other.appendChild(inp);
    nav.appendChild(other);
    var on = nav.querySelector('[aria-pressed="true"]');
    if (on && on.scrollIntoView && state.n !== T0) { try { on.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
  }

  function go(n) {
    state.n = n; state.mass = null; state.choice = null; state.hour = null;
    renderDays(); render();
  }

  // Si la app vuelve del fondo otro día (o pasa la medianoche abierta), se coloca en el nuevo hoy
  function checkDay() {
    var t = todayN();
    if (t === T0) { if (state.tab === 'horas' && !state.hour) render(); return; }
    var wasToday = state.n === T0 || state.n < t;
    setToday();
    if (wasToday) { state.n = T0; state.mass = null; state.choice = null; state.hour = null; }
    renderDays(); render();
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkDay(); });
  window.addEventListener('pageshow', checkDay);
  window.addEventListener('focus', checkDay);
  setInterval(function () { if (document.visibilityState !== 'hidden') checkDay(); }, 60000);

  // ---- Cabecera del día (común a las dos pestañas) ----
  function renderHeader(main, d, a) {
    var p = d.principal;
    var ribbon = document.getElementById('ribbon');
    ribbon.classList.toggle('white', p.color === 'blanco');
    ribbon.style.setProperty('--ribbon', 'var(' + (COLOR_VAR[p.color] || '--lit-verde') + ')');

    main.appendChild(el('p', 'date', DIAS[d.dow] + ', ' + a[2] + ' de ' + MESES[a[1]] + ' de ' + a[0]));
    var h = el('h1', 'title');
    h.appendChild(el('span', 'ini', p.name.charAt(0))); h.appendChild(document.createTextNode(p.name.slice(1)));
    main.appendChild(h);
    if (p.sub) main.appendChild(el('p', 'sub', p.sub));

    var meta = el('div', 'meta');
    if (d.rankName) meta.appendChild(el('span', 'rank', d.rankName));
    var col = el('span', 'color'); var dot = el('i'); colorize(dot, p.color); col.appendChild(dot);
    col.appendChild(document.createTextNode('Color ' + p.color)); meta.appendChild(col);
    var cyc = state.tab === 'horas' ? 'Salterio: semana ' + ROM[Hor.psalterWeek(state.n)] + ' · ' + Hor.tomo(state.n).name : 'Ciclo ' + d.sunCycle + ' · ' + CYCLE_TXT[d.wkCycle];
    meta.appendChild(el('span', 'cycle', cyc));
    main.appendChild(meta);
    if (p.kind !== 'temporal') main.appendChild(el('p', 'temporal', d.temporal.name + (d.temporal.sub ? ' · ' + d.temporal.sub : '')));
  }

  function render() {
    var d = dayOf(state.n), a = Lit.ymd(state.n);
    var main = document.getElementById('panel');
    main.setAttribute('aria-labelledby', 'tab-' + state.tab);
    main.textContent = '';
    renderHeader(main, d, a);
    if (state.tab === 'horas') renderHoras(main, d, a); else renderLecturas(main, d, a);
  }

  // ---- Lecturas ----
  function renderLecturas(main, d, a) {
    function extra(label, list) {
      if (!list || !list.length) return;
      var e = el('p', 'extra'); e.appendChild(el('b', '', label + ' ')); e.appendChild(document.createTextNode(list.join('; ')));
      main.appendChild(e);
    }
    extra('También memoria obligatoria:', d.alsoObligatory);
    extra(d.optional.length > 1 ? 'Memorias libres:' : 'Memoria libre:', d.optional);
    extra('Se puede hacer conmemoración de', d.commemorations);

    var res = Lec.readingsFor(d, window.LECT_T, window.LECT_S);
    var masses = res.masses;
    if (!state.mass || !masses.some(function (m) { return m.id === state.mass; })) {
      var pref = ['dia', 'cena', 'main'];
      state.mass = (masses.find(function (m) { return pref.indexOf(m.id) >= 0; }) || masses[0] || {}).id;
    }
    if (masses.length > 1) {
      var tabs = el('div', 'pills'); tabs.setAttribute('role', 'group'); tabs.setAttribute('aria-label', 'Misa');
      masses.forEach(function (m) {
        var b = el('button', 'pill', m.label);
        b.type = 'button'; b.id = 'misa-' + m.id;
        b.setAttribute('aria-pressed', m.id === state.mass ? 'true' : 'false');
        b.addEventListener('click', function () { state.mass = m.id; render(); });
        tabs.appendChild(b);
      });
      main.appendChild(tabs);
    }
    if (res.note) main.appendChild(el('p', 'note', res.note));

    var current = masses.find(function (m) { return m.id === state.mass; });
    var ol = el('ol', 'readings');
    (current ? current.items : []).forEach(function (it) {

      });
      host.appendChild(add);
      host.appendChild(el('p', 'pr-hint', 'Escribe el capítulo y los versículos como en el misal, por ejemplo «55, 1-11» o «22, 1-3. 4-5».'));
    }
  }

  function textField(id, label, value, ph, set) {
    var f = el('label', 'pr-field'); f.appendChild(el('span', '', label));
    var i = document.createElement('input'); i.type = 'text'; i.id = id; i.value = value || ''; i.placeholder = ph; i.autocomplete = 'off';
    i.addEventListener('input', function () { set(i.value); saveCustom(); updatePreview(); });
    f.appendChild(i); return f;
  }

  function readingEditor(r, i) {
    var li = el('li', 'pr-reading');
    var ft = el('label', 'pr-field'); ft.appendChild(el('span', '', 'Lectura ' + (i + 1)));
    var st = document.createElement('select'); st.id = 'pr-r' + i + '-type';
    R_TYPES.forEach(function (t) { var o = document.createElement('option'); o.value = t; o.textContent = t; if (t === r.type) o.selected = true; st.appendChild(o); });
    st.addEventListener('change', function () { var was = r.type === 'Salmo responsorial'; r.type = st.value; saveCustom(); if (was !== (r.type === 'Salmo responsorial')) renderOptions(); updatePreview(); });
    ft.appendChild(st); li.appendChild(ft);
    var row = el('div', 'pr-row');
    var fb = el('label', 'pr-field'); fb.appendChild(el('span', '', 'Libro'));
    var sb = document.createElement('select'); sb.id = 'pr-r' + i + '-book';
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = 'Elige un libro'; sb.appendChild(o0);
    var ot = document.createElement('optgroup'); ot.label = 'Antiguo Testamento';
    var nt = document.createElement('optgroup'); nt.label = 'Nuevo Testamento';
    var inNT = false;
    Object.keys(Lec.BOOKS).forEach(function (code) {
      if (code === NT_START) inNT = true;
      var o = document.createElement('option'); o.value = code; o.textContent = BOOK_NAMES[code] || code; if (code === r.book) o.selected = true;
      (inNT ? nt : ot).appendChild(o);
    });
    sb.appendChild(ot); sb.appendChild(nt);
    sb.addEventListener('change', function () { r.book = sb.value; saveCustom(); updatePreview(); });
    fb.appendChild(sb); row.appendChild(fb);
    var fr = el('label', 'pr-field'); fr.appendChild(el('span', '', 'Capítulo y versículos'));
    var ir = document.createElement('input'); ir.type = 'text'; ir.id = 'pr-r' + i + '-ref'; ir.value = r.ref || ''; ir.placeholder = '55, 1-11'; ir.inputMode = 'text'; ir.autocomplete = 'off';
    ir.addEventListener('input', function () { r.ref = ir.value; saveCustom(); updatePreview(); });
    fr.appendChild(ir); row.appendChild(fr);
    li.appendChild(row);
    if (r.type === 'Salmo responsorial') {
      var fa = el('label', 'pr-field'); fa.appendChild(el('span', '', 'Respuesta (opcional)'));
      var ia = document.createElement('input'); ia.type = 'text'; ia.id = 'pr-r' + i + '-resp'; ia.value = r.resp || ''; ia.placeholder = 'Escribe aquí la antífona'; ia.autocomplete = 'off';
      ia.addEventListener('input', function () { r.resp = ia.value; saveCustom(); updatePreview(); });
      fa.appendChild(ia); li.appendChild(fa);
    }
    var tools = el('div', 'pr-tools');
    function tool(txt, label, dis, fn) { var b = el('button', 'pr-btn', txt); b.type = 'button'; b.setAttribute('aria-label', label); b.disabled = dis; b.addEventListener('click', fn); tools.appendChild(b); }
    var list = P.custom.readings;
    tool('↑', 'Subir lectura ' + (i + 1), i === 0, function () { list.splice(i - 1, 0, list.splice(i, 1)[0]); saveCustom(); renderOptions(); updatePreview(); });
    tool('↓', 'Bajar lectura ' + (i + 1), i === list.length - 1, function () { list.splice(i + 1, 0, list.splice(i, 1)[0]); saveCustom(); renderOptions(); updatePreview(); });
    tool('Quitar', 'Quitar lectura ' + (i + 1), false, function () { list.splice(i, 1); saveCustom(); renderOptions(); updatePreview(); });
    li.appendChild(tools);
    return li;
  }

  function updatePreview() {
    var spec = currentSpec();
    var host = document.getElementById('pr-sheet');
    MisalPDF.preview(spec, P.size, host);
    var sh = host.querySelector('.sheet'); if (sh) sh.classList.add(P.size);
    document.getElementById('pr-pages').textContent = '';
    document.getElementById('pr-go').disabled = !ready();
    if (!ready()) status('Escribe un título para tu celebración.'); else if (P.lib !== false) status('');
    schedule();
  }

  // Genera el PDF en segundo plano para que los botones respondan al instante
  function keyOf(spec) { return P.size + '|' + JSON.stringify(spec); }
  function schedule() {
    clearTimeout(P.timer);
    if (!P.lib || !ready()) return;
    P.timer = setTimeout(function () { build().catch(function () {}); }, 350);
  }
  function build() {
    var spec = currentSpec(), key = keyOf(spec);
    if (P.cache && P.cache.key === key) return Promise.resolve(P.cache);
    return MisalPDF.render(spec, P.size).then(function (r) {
      P.cache = { key: key, blob: r.blob, pages: r.pages, name: fileName() };
      if (P.open && keyOf(currentSpec()) === key) document.getElementById('pr-pages').textContent = r.pages === 1 ? 'El PDF ocupa 1 página.' : 'El PDF ocupa ' + r.pages + ' páginas.';
      return P.cache;
    });
  }

  // Descarga: dentro de Claude, con permiso del visor; fuera, descarga normal del navegador
  var claudeDl = null;
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function (ns) { claudeDl = ns; refreshShare(); }).catch(function () {});
  }
  function shareable() {
    if (claudeDl || !navigator.canShare) return false;
    try { return navigator.canShare({ files: [new File(['x'], 'x.pdf', { type: 'application/pdf' })] }); } catch (e) { return false; }
  }
  function refreshShare() { document.getElementById('pr-share').hidden = !shareable(); }
  refreshShare();

  document.getElementById('pr-go').addEventListener('click', function () {
    if (!ready()) return;
    status('Creando el PDF…');
    build().then(function (r) {
      if (claudeDl) {
        return claudeDl.save({ filename: r.name, data: r.blob }).then(function () { status('PDF guardado.'); }, function (e) {
          var c = e && e.code;
          status(c === 'declined' ? 'Descarga cancelada.' : c === 'rate_limited' ? 'Ya hay una descarga pendiente; inténtalo en un momento.' : 'Aquí no se puede descargar. Abre la app desde tu página de GitHub.');
        });
      }
      var url = URL.createObjectURL(r.blob), a = document.createElement('a');
      a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      status('PDF descargado: ' + r.name);
    }).catch(function (e) {
      status(e && e.message === 'offline' ? 'Para crear el PDF hace falta conexión a internet la primera vez.' : 'No se ha podido crear el PDF.');
    });
  });
  document.getElementById('pr-share').addEventListener('click', function () {
    if (!ready()) return;
    var spec = currentSpec(), key = keyOf(spec);
    function go(r) {
      var f = new File([r.blob], r.name, { type: 'application/pdf' });
      navigator.share({ files: [f], title: spec.docTitle }).catch(function (e) { if (e && e.name !== 'AbortError') status('No se ha podido compartir; usa «Descargar PDF».'); });
    }
    if (P.cache && P.cache.key === key) go(P.cache);
    else { status('Creando el PDF… vuelve a pulsar «Compartir» cuando esté listo.'); build().then(function () { status('Listo. Pulsa «Compartir o imprimir».'); }); }
  });

  renderTabs();
  renderDays();
  render();
})();
</script>
